<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>台本室 — __PROJECT_TITLE__</title>
  <style>__EDITOR_CSS__</style>
</head>
<body>
  <header class="app-header">
    <button class="mobile-menu icon-button" id="menu-toggle" aria-label="台本一覧を開閉">☰</button>
    <a class="brand" href="documents.html" title="設定資料へ戻る"><span class="brand-seal">書</span><span>台本室<small>__PROJECT_TITLE__</small></span></a>
    <div class="header-divider"></div><span class="header-caption">一行ずつ、物語にする。</span>
    <div class="header-actions">
      <span id="save-state" class="save-state" role="status">ブラウザに自動保存</span>
      <button id="save-button" class="quiet">保存</button>
      <button id="help-button" class="quiet">使い方</button>
      <button id="import-button" class="quiet">読み込む</button>
      <button id="export-button" class="primary">書き出す <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <div id="storage-warning" class="warning-bar" role="alert" hidden></div>
  <div class="layout">
    <aside class="sidebar" aria-label="台本一覧">
      <div class="sidebar-heading"><h1>台本</h1><span id="draft-count" class="count">0</span></div>
      <button id="catalog-button" class="catalog-button">＋ 既存イベントから書く</button>
      <button id="new-button" class="new-button">＋ 白紙の台本</button>
      <label class="search-field"><span aria-hidden="true">⌕</span><input id="draft-search" placeholder="タイトル・ID・台詞を検索" aria-label="台本を検索"></label>
      <label class="verdict-control">判定で絞り込む<select id="verdict-filter"><option value="all">すべて</option><option value="">未判定</option><option value="good">良い</option><option value="fix">要修正</option><option value="hold">保留・別案</option><option value="reject">ボツ</option></select></label><div id="draft-list" class="draft-list"></div>
      <div class="sidebar-footer"><span class="small-label">執筆の手元に</span><a href="documents.html">設定資料 <span>↗</span></a><a href="documents.html">イベント設計 <span>↗</span></a><p id="storage-description"></p></div>
    </aside>
    <main class="writing-pane" id="writing-pane">
      <section class="document-heading">
        <div class="eyebrow"><span id="event-code">NEW SCRIPT</span><div class="document-actions"><button id="duplicate-event" class="quiet small">複製</button><button id="delete-event" class="quiet small">削除</button></div></div>
        <input id="event-title" class="title-input" aria-label="台本のタイトル" placeholder="台本のタイトル">
        <div class="meta-line"><select id="event-status" aria-label="執筆状況"><option value="draft">○ 未着手</option><option value="writing">◐ 執筆中</option><option value="review">◒ 推敲中</option><option value="done">● 執筆完了</option></select><label class="verdict-control">判定<select id="event-verdict" aria-label="判定タグ"><option value="">未判定</option><option value="good">良い</option><option value="fix">要修正</option><option value="hold">保留・別案</option><option value="reject">ボツ</option></select></label><span id="document-stats"></span><button id="meta-toggle" class="quiet small" aria-expanded="false">イベント情報 ▾</button></div>
        <div id="event-meta" class="event-meta" hidden>
          <label>イベントID<input id="event-sourceId" placeholder="任意のID"></label>
          <label>時期<input id="event-period" placeholder="例：1年目・春"></label>
          <label>ルート<select id="event-route"></select></label>
          <label>場所<input id="event-place" placeholder="例：外堡の街道"></label>
          <label class="wide">制作メモ<textarea id="event-notes" rows="2" placeholder="書き進めるための覚え書き。読み合わせには表示しません。"></textarea></label>
        </div>
      </section>
      <div class="document-views" role="tablist" aria-label="台本の表示"><button id="script-view-tab" role="tab" aria-selected="true" aria-controls="script-panel">台本を書く</button><button id="chart-view-tab" role="tab" aria-selected="false" aria-controls="chart-panel">イベント内チャート</button></div>
      <section id="script-panel" role="tabpanel" aria-labelledby="script-view-tab">
      <div class="writing-toolbar"><span class="small-label">行を追加</span><div id="add-tools" class="add-tools"></div><div class="undo-tools"><button id="undo-button" class="icon-button" title="元に戻す（Ctrl / ⌘ Z）" aria-label="元に戻す">↶</button><button id="redo-button" class="icon-button" title="やり直す（Ctrl / ⌘ Shift Z）" aria-label="やり直す">↷</button></div></div>
      <div class="manuscript" id="manuscript"></div>
      <div class="document-bottom"><button id="add-dialogue-bottom" class="add-bottom">＋ 台詞を続ける</button><span>Ctrl / ⌘ + Enter で次の行を追加</span></div>
      </section>
      <section id="chart-panel" role="tabpanel" aria-labelledby="chart-view-tab" hidden></section>
    </main>
    <aside class="reader-pane" aria-label="読み合わせ・原案・添削・履歴">
      <div class="reader-tabs" role="tablist"><button role="tab" aria-selected="true" id="preview-tab">読み合わせ</button><button role="tab" aria-selected="false" id="reference-tab">原案</button><button role="tab" aria-selected="false" id="comments-tab">添削</button><button role="tab" aria-selected="false" id="rules-tab">表記</button><button role="tab" aria-selected="false" id="history-tab">履歴</button></div>
      <section id="preview-panel" role="tabpanel" aria-labelledby="preview-tab">
        <div class="reader-top"><span class="small-label">READ THROUGH</span><button id="restart-button" class="quiet small">はじめから ↺</button></div>
        <div id="preview-stage" class="preview-stage"></div>
        <div class="reader-bottom"><button id="check-button" class="check-button">台本を点検 <span id="issue-count"></span></button><p>選択肢を押すと分岐先を読めます。<br>条件メモは表示を見ながら確認できます。</p></div>
      </section>
      <section id="reference-panel" role="tabpanel" aria-labelledby="reference-tab" hidden></section>
      <section id="comments-panel" role="tabpanel" aria-labelledby="comments-tab" hidden></section>
      <section id="history-panel" role="tabpanel" aria-labelledby="history-tab" hidden></section>
      <section id="rules-panel" role="tabpanel" aria-labelledby="rules-tab" hidden></section>
    </aside>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="閉じる">×</button></div><div id="modal-body"></div></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <datalist id="speakers"></datalist>
  <datalist id="expressions"><option>通常</option><option>笑顔</option><option>困惑</option><option>怒り</option><option>驚き</option><option>沈黙</option><option>小声</option></datalist>
  <script type="application/json" id="project-config">__PROJECT_CONFIG__</script>
  <script type="application/json" id="event-catalog">__EVENT_CATALOG__</script>
  <script>__EDITOR_MODEL__</script>
  <script>__EDITOR_COLLABORATION__</script>
  <script>__EDITOR_CHART__</script>
  <script>__EDITOR_REVIEW__</script>
  <script>__EDITOR_APP__</script>
</body>
</html>
